memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300

max_input_vars = 10000

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; Containers collect stdout/stderr; a file inside the container is lost on
; redeploy and invisible to the platform log viewer.
error_log = /dev/stderr

date.timezone = "UTC"
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sentry's setup guide asks for this to be Off, which puts every function
; argument into exception stack traces. Deliberately left On here: those
; arguments are customer records, invoice payloads and credentials passed to
; auth calls, and shipping them is exactly what SENTRY_SEND_DEFAULT_PII=false
; exists to prevent. Errors still carry file, line and the full frame list -
; only the argument values are withheld. Set to Off only with a decision
; about what that sends to a third party.
zend.exception_ignore_args = On
